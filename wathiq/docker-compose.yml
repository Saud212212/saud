# تشغيل وثيق محلياً بالكامل: docker compose up --build
# الخدمات: postgres · s3 (SeaweedFS) · migrate (مرة واحدة) · app · worker
name: wathiq

x-app-env: &app-env
  DATABASE_URL: postgresql://wathiq_app:wathiq_app_dev@postgres:5432/wathiq
  KEYSTORE_DATABASE_URL: postgresql://wathiq_app:wathiq_app_dev@postgres:5432/wathiq_keys
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  WATHIQ_MASTER_KEYS: ${WATHIQ_MASTER_KEYS:?set WATHIQ_MASTER_KEYS in .env (echo "k1:$(openssl rand -base64 32)")}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: wathiq
  S3_ACCESS_KEY_ID: wathiq
  S3_SECRET_ACCESS_KEY: wathiq-dev-secret
  S3_FORCE_PATH_STYLE: "true"
  DEV_LOGIN: ${DEV_LOGIN:-true}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./infra/postgres/01-database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - ./infra/postgres/02-keystore-database.sql:/docker-entrypoint-initdb.d/02-keystore-database.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wathiq"]
      interval: 3s
      retries: 20

  # تخزين متوافق مع S3 للتطوير المحلي (SeaweedFS مفتوح المصدر).
  # في الإنتاج: أي مزود S3 (بما فيها مزودون داخل السعودية) عبر متغيرات S3_* فقط.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 3s
      retries: 30

  migrate:
    build: { context: ., dockerfile: Dockerfile.worker }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      MIGRATION_DATABASE_URL: postgresql://wathiq_owner:wathiq_owner_dev@postgres:5432/wathiq
      KEYSTORE_MIGRATION_DATABASE_URL: postgresql://wathiq_owner:wathiq_owner_dev@postgres:5432/wathiq_keys
    command: ["sh", "-c", "npx tsx scripts/migrate.ts && DATABASE_URL=postgresql://wathiq_app:wathiq_app_dev@postgres:5432/wathiq WATHIQ_MASTER_KEYS=seed:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= SESSION_SECRET=seed-only-secret npx tsx scripts/seed.ts"]

  # عرض محلي: وضع التطوير لأن الدخول التجريبي معطّل برمجياً في الإنتاج (NODE_ENV=production)
  # حتى تأتي المصادقة الحقيقية في المرحلة 5. للإنتاج: احذف command وNODE_ENV.
  app:
    build: .
    command: ["npx", "next", "dev", "-p", "3100"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }
    environment:
      <<: *app-env
      NODE_ENV: development
    ports: ["3100:3100"]

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    # نسخة PDF المفكوكة لأداة OCR تُكتب في /tmp مؤقتاً؛ tmpfs يضمن أنها في الذاكرة فقط
    # ولا تبقى على القرص حتى لو توقفت العملية فجأة
    tmpfs: ["/tmp:mode=1777,size=2g"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }
    environment: *app-env

volumes:
  pgdata:
  s3data:
